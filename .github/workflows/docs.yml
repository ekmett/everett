# \file
# \author Edward Kmett <ekmett@gmail.com>
# \brief Builds and checks Everett's API and Markdown documentation.

name: Documentation

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Everett
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen
          doxygen --version

      - name: Build and check documentation
        run: |
          python3 tests/check_doxygen.py \
            --doxygen doxygen \
            --source . \
            --output build-docs
